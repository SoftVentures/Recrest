[package]
name = "recrest"
version = "0.10.0" # x-release-please-version
description = "Recrest — A lightweight developer dashboard"
authors = ["SoftVentures"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "recrest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The compiled binary filename drives the macOS Dock hover label for
# unbundled `cargo run` dev binaries — macOS Dock reads `kLSDisplayNameKey`
# from LaunchServices, which defaults to the executable filename for any
# process without a `.app` bundle wrapper. NSProcessInfo.setProcessName
# (called in lib.rs::run) updates internal app state but does NOT propagate
# to that key, so it leaves the lowercase basename visible. Naming the
# output "Recrest" makes the dev Dock show "Recrest" instead of "recrest".
# Release `.app` builds keep CFBundleName/CFBundleDisplayName for the
# user-facing name and aren't affected.
[[bin]]
name = "Recrest"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2.2"
tauri-plugin-store = "2.4"
tauri-plugin-notification = "2.2"
tauri-plugin-os = "2.3"
tauri-plugin-shell = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-updater = "2.9"
tauri-plugin-deep-link = "2.4"
tauri-plugin-process = "2.3"
tauri-plugin-single-instance = "2.3"
tauri-plugin-dialog = "2.3"
# Persists window size / position (→ monitor) / maximized / fullscreen across
# restarts, cross-platform. Auto-saves on exit, restores on launch.
tauri-plugin-window-state = "2.4"
# Native vibrancy / blurred backdrop. On macOS we always apply HudWindow
# vibrancy on startup — when the active theme uses an opaque background it's
# simply invisible; the Glassy theme renders translucent surfaces so the
# vibrancy shows through. On Windows we apply Acrylic for the same reason.
# Linux has no compositor blur, so Glassy falls back to a semi-transparent
# surface without blur — documented as a platform limitation.
window-vibrancy = "0.8"
sentry = "0.48"
os_info = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh", "ssh_key_from_memory"] }
notify = "8.2"
notify-debouncer-full = "0.7"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
keyring = { version = "3.5", features = ["apple-native", "windows-native", "linux-native"] }
url = "2.5"
dirs = "6.0"
zeroize = "1"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
urlencoding = "2.1.3"
base64 = "0.22.1"
which = "8"
deunicode = "1"
# Plan 03/04 (C.4/C.5): YAML parsing for workflow_dispatch inputs, and a
# unified-diff parser used by the Bitbucket provider where the API returns
# the whole PR diff as a single text blob.
serde_yaml = "0.9"
unidiff = "0.4"
# GitLab multi-line MR discussions anchor each range boundary with a
# `line_code` of the form `<SHA1(file_path)>_<old>_<new>` — a plain SHA1 of the
# file path, not a git blob OID, so `git2`'s hashing can't produce it. Pure
# Rust (RustCrypto), no native linking, no second libgit2.
sha1 = "0.11"
# sha1 0.11 returns `digest::Output` (a `hybrid-array::Array`) which no
# longer implements `LowerHex`, so we hex-encode manually.
hex = "0.4"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
# Used by `commands::repos::delete_repo` to move a repo folder into the OS
# trash (macOS Trash, Windows Recycle Bin, freedesktop Trash on Linux). All
# destructive UI flows go through the trash so the user can recover from a
# mis-click — we never permanently `rm -rf` from a button.
trash = "5"
ignore = "0.4.26"

[target.'cfg(windows)'.dependencies]
# Single Win32 dependency (M4 — was windows + windows-sys side-by-side).
# Used by `platform::windows::snap` to subclass the main HWND so WM_NCHITTEST
# can return HTMAXBUTTON over the maximize button — that's the trigger
# Windows 11 needs to surface the Snap-Layouts flyout — and by `lib.rs::
# set_app_user_model_id` so Toast notifications attribute to "Recrest"
# instead of the parent process (e.g. powershell.exe in dev). The richer
# `windows` crate is needed (vs `windows-sys`) because `SetWindowSubclass`
# lives in the Win32 ABI helpers and we want safe HWND/LPARAM wrappers.
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry"] }
# Phase 6 discovery — scans `HKLM/HKCU\Software\Microsoft\Windows\CurrentVersion\App Paths`
# for installed editors and terminals. Pure Rust, no native linking.
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
# Sets NSApp.applicationIconImage at runtime so Stage Manager / Mission
# Control show Recrest's icon in dev mode (where there's no .app bundle),
# and re-applies it live when the user toggles system Dark Mode. The live
# update is driven by a 1.5s poller in `spawn_macos_appearance_poller` —
# `NSDistributedNotificationCenter` and `WindowEvent::ThemeChanged` were
# both tried and proved unreliable for system-wide appearance flips, so
# we no longer need `block2` or the `NSDistributedNotificationCenter`/
# `NSNotification`/`NSOperation` features on `objc2-foundation`.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSAppearance", "NSDockTile"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSProcessInfo"] }
# Phase 6 discovery — reads `CFBundleIdentifier` from each `.app`'s
# `Contents/Info.plist`. Pure Rust (no native linking).
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Direct notify-rust use on Linux so we can attach the Recrest icon name +
# image-path hint that dunst/Plasma/GNOME need to display the app logo
# on toasts. The Tauri notification plugin doesn't expose those fields.
notify-rust = { version = "4", features = [] }
# Phase 6 discovery — parses freedesktop `.desktop` entries to find installed
# terminals and IDEs. Pure Rust, no native linking.
freedesktop-desktop-entry = "0.8"

[dev-dependencies]
# Phase 3 backend test harness: throwaway git repos + mocked provider HTTP.
# `tokio` reappears here only for the `test-util` feature which enables
# `#[tokio::test(start_paused = true)]` — Plan 03/07 needs it so the GitLab
# rebase-timeout regression test fast-forwards through 30 × 1s polls instead
# of actually sleeping.
tempfile = "3"
tokio = { version = "1.40", features = ["test-util"] }
wiremock = "0.6"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
