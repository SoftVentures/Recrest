<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicon is owned at runtime by `useFaviconSync` (theme + dev/prod aware).
      We declare only the SVG slot here so the hook has a stable element to
      mutate, and Apple-touch is left for home-screen pinning. PNG / ICO
      fallbacks were removed because every browser the dev/web preview
      targets (Chrome, FF, Safari 17+, Edge) supports SVG favicons and would
      otherwise out-prioritise the SVG when both are present with explicit
      `sizes` — that's what caused the dev badge to silently lose to the
      production PNG on the tab.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Recrest — a lightweight developer dashboard for your local git repositories, open pull requests, and CI checks."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Recrest</title>
    <script>
      // Anti-flash bootstrap. Runs synchronously before React mounts so the
      // first paint already has the correct `data-theme` on <html> and a
      // matching background colour on <body>. Without this the app renders
      // with the reducer's "light" initial state and flips to dark a tick
      // later, which the user perceives as a jarring flash on every reload.
      //
      // Order of preference for theme:
      //   1. `recrest:theme-follows-system === "true"` → resolve via matchMedia
      //   2. explicit `recrest:theme` ∈ {light,dark} → use it
      //   3. legacy `glassy` / `oled` migrate to `dark` (the orthogonal
      //      translucency + high-contrast toggles replaced them)
      //   4. fall back to matchMedia (first run / no localStorage)
      //
      // Translucency is orthogonal: a separate `recrest:translucency-enabled`
      // flag wins over the theme background — when true we paint `<html>`
      // transparent regardless of theme so the OS vibrancy/acrylic shows
      // through from frame 1 (eliminates the dark→transparent flicker the
      // old single-flag scheme exhibited on every reload).
      //
      // The string literals here intentionally duplicate `StorageKey.THEME`,
      // `StorageKey.THEME_FOLLOWS_SYSTEM`, `StorageKey.TRANSLUCENCY_ENABLED`
      // and `StorageKey.UI_SCALE` because this script runs before any module
      // loads. If you rename any of those keys, update this block too —
      // there is no other sanctioned magic-string exception in the renderer.
      (function () {
        try {
          // Interface scale first: `globals.css` derives the root font size
          // from it, so every rem length in the app depends on it. It reaches
          // the DOM otherwise only after `loadSettings` has round-tripped to
          // the backend, which means a scaled user watches the whole UI paint
          // at 100 % and then reflow. Clamped to the same range as
          // `clampUiScale` so a corrupted value can't blow up the layout.
          var scaleRaw = null;
          try {
            scaleRaw = localStorage.getItem("recrest:ui-scale");
          } catch (_) {}
          var scale = parseFloat(scaleRaw);
          if (!isNaN(scale)) {
            document.documentElement.style.setProperty(
              "--ui-scale",
              String(Math.min(1.5, Math.max(0.8, scale))),
            );
          }
        } catch (e) {
          /* swallow — the default scale stands */
        }
        try {
          var stored = null;
          var follows = null;
          var translucent = null;
          try {
            stored = localStorage.getItem("recrest:theme");
            follows = localStorage.getItem("recrest:theme-follows-system");
            translucent = localStorage.getItem("recrest:translucency-enabled");
          } catch (_) {}
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var themeId;
          if (follows === "true") {
            themeId = prefersDark ? "dark" : "light";
          } else if (stored === "light" || stored === "dark") {
            themeId = stored;
          } else if (stored === "glassy") {
            // Legacy: the old "glassy" theme migrates to "dark" plus the
            // translucency flag at the renderer/backend boundary. Pick the
            // same answer here so frame 1 matches the migrated state.
            themeId = "dark";
            if (translucent === null) translucent = "true";
          } else if (stored === "oled") {
            // Legacy: the retired OLED-Black variant migrates to dark.
            themeId = "dark";
          } else {
            themeId = prefersDark ? "dark" : "light";
          }
          var isDark = themeId === "dark";
          var isTranslucent = translucent === "true";
          var root = document.documentElement;
          root.setAttribute("data-theme", isDark ? "dark" : "light");
          root.setAttribute("data-theme-id", themeId);
          root.setAttribute("data-boot-theme", themeId);
          root.setAttribute("data-translucent", isTranslucent ? "true" : "false");
          root.style.backgroundColor = isTranslucent
            ? "transparent"
            : isDark
              ? "#0b0d12"
              : "#ffffff";
          // Translucency vars consumed by the `html::before` glass layer
          // (see the inline <style> below). Reading the user's last slider
          // values from localStorage means frame 1 already paints with
          // the right tint + blur — no "transparent → desktop → blur
          // applied" cold-boot sequence.
          if (isTranslucent) {
            var intensityRaw = null;
            var blurRaw = null;
            try {
              intensityRaw = localStorage.getItem("recrest:translucency-intensity");
              blurRaw = localStorage.getItem("recrest:translucency-blur");
            } catch (_) {}
            var clamp = function (n, fallback) {
              var v = parseInt(n, 10);
              if (isNaN(v)) return fallback;
              return Math.min(100, Math.max(0, v));
            };
            var intensity = clamp(intensityRaw, 50);
            var blurI = clamp(blurRaw, 30);
            var rgb = isDark ? "11, 13, 18" : "250, 250, 250";
            var alpha = (100 - intensity) / 100;
            var blurPx = Math.round((blurI * 30) / 100);
            root.style.setProperty("--translucency-bg", "rgba(" + rgb + ", " + alpha + ")");
            root.style.setProperty("--translucency-blur-px", blurPx + "px");
          }
        } catch (e) {
          /* swallow — defaults stand */
        }
      })();
    </script>
    <style>
      /*
       * Boot anti-flash for translucency: applies BEFORE the JS bundle (and
       * with it, MUI's CssBaseline + globals.css) loads. The anti-flash
       * script above sets `data-translucent` on <html> AND seeds the two
       * `--translucency-*` CSS variables from localStorage, so the
       * `html::before` glass layer below paints with the right tint + blur
       * from FRAME 1. Without these (CSS rule only in globals.css), the
       * cold-boot sequence the user saw was: 1) transparent desktop,
       * 2) gray window-frame shadows, 3) blur applies once JS finished
       * loading. Now: 1) glass with user's settings, end of story.
       *
       * The duplicated `html::before` rule mirrors the one in globals.css —
       * Vite serves globals.css async via the JS bundle in dev, so we
       * keep this inline copy as a load-order safety net. Keep the two in
       * sync.
       */
      /*
       * Same load-order problem for the interface scale: the script above
       * seeds `--ui-scale` before the bundle, but the rule that *consumes*
       * it lives in globals.css, which Vite serves through the JS bundle.
       * Without this inline copy the first paint is laid out at 100 % and
       * the whole UI reflows once the stylesheet lands. Mirrors globals.css
       * — keep the two in sync.
       */
      html {
        font-size: calc(16px * var(--ui-scale, 1));
      }
      html[data-translucent="true"],
      html[data-translucent="true"] body,
      html[data-translucent="true"] #root {
        background-color: transparent !important;
        background-image: none !important;
      }
      html[data-translucent="true"]::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-color: var(--translucency-bg, transparent);
        -webkit-backdrop-filter: blur(var(--translucency-blur-px, 0px));
        backdrop-filter: blur(var(--translucency-blur-px, 0px));
        will-change: backdrop-filter, transform;
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        contain: layout style paint;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
