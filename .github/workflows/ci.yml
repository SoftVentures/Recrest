name: ✅ CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pattern='^(main|develop|(feature|bugfix|patch|docs|test|ci|revert|release|hotfix|dependabot)\/.+)$'
          if ! printf '%s' "$HEAD_REF" | grep -Eq "$pattern"; then
            echo "::error::Branch name '$HEAD_REF' does not match the required pattern."
            echo "Allowed: main, develop, <type>/<topic> with type ∈ feature|bugfix|patch|docs|test|ci|revert|release|hotfix, or dependabot/*"
            exit 1
          fi
          echo "OK: $HEAD_REF"

  dependabot-type:
    name: dependabot commit-type reserved
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check for dependabot-typed commits by non-bot authors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "PR author is dependabot[bot] — nothing to enforce."
            exit 0
          fi

          # Flag only commits that BOTH carry the reserved `dependabot:` prefix
          # AND were authored by a human. Legitimate dependabot[bot] commits
          # routinely flow through human-opened aggregation / release PRs; the
          # author-email guard (%ae contains `dependabot[bot]`) lets those pass
          # while still catching a human who squats the prefix. Tab-delimited
          # so multi-word author names / subjects don't break field parsing.
          offenders="$(git log --format='%H%x09%ae%x09%s' "$BASE_SHA..$HEAD_SHA" \
            | awk -F'\t' '$2 !~ /dependabot\[bot\]/ && $3 ~ /^dependabot(\([^)]*\))?!?:/ { print substr($1, 1, 9) " " $3 }' \
            || true)"

          if [ -n "$offenders" ]; then
            echo "::error::Commit type 'dependabot' is reserved for dependabot[bot]."
            echo "The following human-authored commits use the prefix without authorisation:"
            printf '%s\n' "$offenders"
            echo ""
            echo "Fix: use a different allowed type (e.g. ci, patch, bugfix)."
            exit 1
          fi

          echo "OK: no dependabot-typed commits authored by non-bot users."

  tauri-devtools-guard:
    name: Guard tauri devtools feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Guard against `devtools` Cargo feature on tauri
        run: |
          if grep -E 'tauri\s*=\s*\{[^}]*features\s*=\s*\[[^]]*devtools[^]]*\]' app/src-tauri/Cargo.toml; then
            echo "::error::tauri crate has 'devtools' feature enabled — release builds would ship devtools."
            exit 1
          fi
          echo "OK: devtools feature not enabled."

  # Every file that carries the product version must agree with the root
  # package.json. release-please bumps them together via
  # `.github/release-please-config.json::extra-files`, so a divergence means one
  # of them is not actually wired in (or its `x-release-please-version` marker
  # is on the wrong line — the Generic updater only rewrites the marker's OWN
  # line).
  #
  # Why here and not only in the release workflow: `release-tauri.yml`'s
  # `verify-metadata` job is the same assertion, but it fires on the
  # `push: tags` trigger — after the tag exists. At that point the only recovery
  # is amending `main` and re-dispatching, and manual dispatch DELETES the
  # release. Running it on every PR turns that into a red Release PR instead.
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Assert every version-bearing file matches the root package.json
        shell: bash
        run: |
          set -uo pipefail
          rc=0

          # Every capture below ends in `|| true`: GitHub runs `shell: bash` as
          # `bash --noprofile --norc -eo pipefail`, so `-e` is on and a failing
          # `jq`/`grep`/`sed` inside `$( )` would kill the step before the
          # ::error:: line that explains what diverged.
          version="$(jq -r '.version // empty' package.json || true)"
          if [ -z "$version" ]; then
            echo "::error::could not read .version from the root package.json"
            exit 1
          fi
          echo "root package.json → $version"

          check() {
            local label="$1" got="$2"
            if [ -z "$got" ]; then
              echo "::error::could not read a version from $label — its format changed, or the file moved"
              rc=1; return
            fi
            if [ "$got" != "$version" ]; then
              echo "::error::$label is $got but the root package.json is $version. These are bumped together by release-please; check .github/release-please-config.json::extra-files."
              rc=1; return
            fi
            echo "✓ $label → $got"
          }

          for f in \
            app/package.json \
            shared/package.json \
            landingpage/package.json \
            tests/package.json \
            app/src-tauri/tauri.conf.json; do
            check "$f" "$(jq -r '.version // empty' "$f" || true)"
          done

          # Anchored on the release-please marker, same as `verify-metadata`.
          check "app/src-tauri/Cargo.toml" \
            "$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)"[[:space:]]*#[[:space:]]*x-release-please-version.*/\1/p' app/src-tauri/Cargo.toml | head -n1 || true)"
          check "shared/src/constants/app.ts (APP_VERSION)" \
            "$(sed -n 's/^export const APP_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' shared/src/constants/app.ts | head -n1 || true)"
          # Hand-maintained on purpose (see the comment on the constant) — this
          # check is what makes "consciously" mean "before merge".
          check "tests/src/helpers/constants.ts (EXPECTED_APP_VERSION)" \
            "$(sed -n 's/^export const EXPECTED_APP_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' tests/src/helpers/constants.ts | head -n1 || true)"

          # RELEASE.md becomes both the GitHub Release body and the in-app
          # updater's `notes`. Same grep/sed pair as `verify-metadata`, so the
          # two gates cannot disagree about what the H1 says.
          heading="$(grep -m1 -E '^#[[:space:]]*Recrest[[:space:]]+[0-9]' RELEASE.md || true)"
          check "RELEASE.md (H1)" \
            "$(printf '%s\n' "$heading" \
              | sed -n 's/^#[[:space:]]*Recrest[[:space:]]\{1,\}\([0-9][0-9A-Za-z.+-]*\).*/\1/p' || true)"

          exit $rc

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      # Runs the app suite with V8 coverage; the thresholds in
      # app/vitest.config.ts (lines/branches) fail this job on regression.
      - run: yarn test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: app-coverage
          path: app/coverage
          retention-days: 7

  e2e:
    name: Playwright E2E (optional)
    # ADVISORY, NOT GATING — and the two halves of that are wired in two
    # different places, so changing one alone does nothing:
    #   * `continue-on-error: true` below keeps this job's failure from failing
    #     the workflow run;
    #   * `e2e` is deliberately absent from `ci-pass`'s `needs:` list, which is
    #     the aggregate check Branch Protection actually requires.
    # Consequence to be honest about: no Playwright spec in `tests/` can turn a
    # PR red today. Reason it stays that way for now: the suite fails with
    # pre-existing failures across all seven projects and has been red on `main`
    # too, so requiring it would block unrelated work on inherited breakage.
    # Triaging those failures and promoting this job to required is tracked in
    # `docs/plans/09-bug-audit-remediation.md`. Until then, verify new specs
    # locally — see `tests/CLAUDE.md`.
    #
    # Ubuntu 24.04 is required: Playwright 1.59 ships a WebKit build that
    # links against libgtk-4, libavif.so.13, libmanette, libhyphen — none of
    # which are available on the 22.04 image, so `browserType.launch` dies
    # with "Host system is missing dependencies" before a single test runs.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - uses: ./.github/actions/seed-env
      # Split install-deps from browser install: in Playwright 1.59 the
      # `--with-deps` flag silently skips the apt-get step when the workspace
      # is invoked via `yarn workspace`, leaving WebKit without its GTK-4 /
      # flite / hyphen / manette bundle. Running install-deps directly under
      # sudo fixes it for real.
      - name: Install Playwright system deps
        run: sudo yarn workspace @recrest/tests exec playwright install-deps
      - name: Install Playwright browsers
        run: yarn workspace @recrest/tests exec playwright install
      - run: yarn test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

  storybook:
    name: Storybook build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn workspace @recrest/app build-storybook

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn workspace @recrest/shared build
      - run: yarn workspace @recrest/app build
      # The dev IPC stub and its seed data must never reach a desktop user.
      # Reuses the bundle built above instead of rebuilding it.
      - name: Guard — dev IPC stub must not ship in the production bundle
        run: yarn guard:devstub:check

  landingpage-build:
    name: Landingpage production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn build:landingpage

  # Aggregate required-status-check referenced by Branch Protection.
  # Keeps the protection rule stable even if we rename or split jobs above.
  #
  # `e2e` is deliberately NOT in this list — see the note on that job. Adding it
  # is what "make Playwright gating" means; nothing else has to change.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs:
      [
        branch-name,
        dependabot-type,
        tauri-devtools-guard,
        version-sync,
        typecheck,
        lint,
        format,
        test,
        storybook,
        web-build,
        landingpage-build,
      ]
    if: always()
    steps:
      # `skipped` is deliberately NOT treated as a failure here, unlike in
      # `rust.yml::rust-pass`: `branch-name` and `dependabot-type` are
      # `if: github.event_name == 'pull_request'`, so both legitimately skip on
      # every push to `main`/`develop`. Any job added to `needs` above that has
      # no `if:` therefore cannot be distinguished from those two if it skips —
      # keep new unconditional jobs unconditional.
      - name: Verify all required jobs passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed."
