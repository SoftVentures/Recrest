name: 🤖 Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned: this job runs with `contents: write` + `pull-requests:
      # write` and creates the tag that triggers the signed release build, so a
      # re-pointed `@v5` tag would be a direct path into the release pipeline.
      # Dependabot's `github-actions` ecosystem keeps the SHA and the trailing
      # version comment in sync.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
