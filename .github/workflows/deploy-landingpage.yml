name: 🌐 Deploy landingpage

on:
  push:
    branches: [main]
    paths:
      - "landingpage/**"
      - "app/**"
      - "shared/**"
      - "package.json"
      - ".github/workflows/deploy-landingpage.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      # Before anything is built, let alone uploaded: the download buttons are
      # baked with the package.json version but resolve through
      # `/releases/latest`, so a build made between release-please's version bump
      # and a human publishing the draft release ships seven 404s — and the E2E
      # spec cannot see it, because it asserts against the same version. Failing
      # here leaves the previously deployed page (which still links the release
      # that IS latest) in place. See the header of the script for the full
      # reasoning and for why this is not a `ci.yml` gate.
      - name: Guard — download links resolve on the published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Plain `node`, not `yarn guard:downloads`: this runs before
        # `install-deps` on purpose (it needs no node_modules, and a dead-link
        # deploy should fail in seconds rather than after a full install+build).
        run: node scripts/check-download-links.mjs
      - uses: ./.github/actions/install-deps
      - name: Build landingpage
        run: yarn build:landingpage
        env:
          BASE_PATH: /Recrest/
          VITE_IMPRINT_NAME: ${{ secrets.VITE_IMPRINT_NAME }}
          VITE_IMPRINT_STREET: ${{ secrets.VITE_IMPRINT_STREET }}
          VITE_IMPRINT_POSTAL_CODE: ${{ secrets.VITE_IMPRINT_POSTAL_CODE }}
          VITE_IMPRINT_CITY: ${{ secrets.VITE_IMPRINT_CITY }}
          VITE_IMPRINT_COUNTRY: ${{ secrets.VITE_IMPRINT_COUNTRY }}
          VITE_IMPRINT_EMAIL: ${{ secrets.VITE_IMPRINT_EMAIL }}
          VITE_IMPRINT_PHONE: ${{ secrets.VITE_IMPRINT_PHONE }}
          VITE_IMPRINT_RESPONSIBLE_PERSON: ${{ secrets.VITE_IMPRINT_RESPONSIBLE_PERSON }}
      - name: Build live demo (web app, seeded)
        run: yarn build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: landingpage/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
