# The Rust backend (`app/src-tauri`) had no CI at all: `yarn rust:check`,
# `rust:test`, `rust:clippy` and `verify` existed in package.json and were
# wired into no workflow, so the first time Windows- and macOS-only `#[cfg]`
# code got compiled was inside the release matrix — where every leg runs with
# `continue-on-error: true` and a compile failure turns into a silently missing
# installer instead of a red build.
#
# This workflow closes that hole. It is the Rust counterpart to `ci.yml`
# (which covers TypeScript only) and mirrors the release build environment:
# same Ubuntu image, same system dependency list, so "compiles here" means
# "compiles in the release matrix".
#
# MATRIX COST — deliberate asymmetry
#   Pull requests run the Linux leg only. A cold build of this dependency tree
#   (tauri + git2 with vendored libgit2/openssl + sentry + reqwest, ~700
#   crates) is roughly 12–18 min on Linux, 12–18 min on macOS and 20–25 min on
#   Windows; with a warm `Swatinem/rust-cache` it drops to ~4–6 min per leg.
#   Paying 3× that on every push of every PR — at the 10×/2× minute multipliers
#   macOS/Windows carry — is not worth it for code that is >90% platform
#   independent.
#   Pushes to `main`/`develop` and manual dispatches run all three. That is the
#   release path: a tag is always cut from `main`, so every platform-specific
#   `#[cfg]` block is compiled, linted and tested at least once before any
#   release build starts. The trade-off is that a Windows-only or macOS-only
#   break is caught on merge rather than on the PR — one commit later, but
#   still strictly before the release matrix that used to swallow it.
name: 🦀 Rust CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental artifacts are useless across runners and roughly double what
  # `rust-cache` has to store — GitHub's cache budget is 10 GB per repo.
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Expression-driven matrix (see the cost note at the top of the file):
        # Linux only on pull requests, all three platforms on the release path.
        # `strategy` can read the `github` context, and the `A && x || y` form
        # is GitHub's ternary — the left-hand string is always truthy here.
        #
        # ubuntu-22.04 on purpose, NOT ubuntu-latest: it is the image the Tauri
        # release build uses, and the webkit2gtk-4.1 ABI is what the shipped
        # Linux binary links against.
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Exactly the list the Tauri build jobs install (release-tauri.yml /
      # release-tauri-beta.yml). Keep the three in sync — a dependency that is
      # needed to build the release bundle but missing here means this workflow
      # is not actually reproducing the release environment.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      # SHA-pinned like every other third-party action in this repo. `toolchain:`
      # must be explicit with a SHA pin — the action otherwise derives the
      # toolchain name from the ref it was called with, and a SHA is not a valid
      # rustup toolchain.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Caches the cargo registry, the git checkouts (this crate pulls
      # `fix-path-env` from git) and `app/src-tauri/target`, keyed on
      # Cargo.lock + rustc version, with intermediate artifacts pruned.
      #
      # Only pushes to main/develop and manual runs write the cache: PR
      # branches are short-lived and would each claim ~1–2 GB of the repo's
      # 10 GB budget, evicting the entries every other PR then reads.
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.platform }}
          save-if: ${{ github.event_name != 'pull_request' }}

      # `tauri::generate_context!` embeds `build.frontendDist` when it is
      # compiled outside dev mode. Debug builds take the `devUrl` branch and do
      # not need it, but building the frontend just to satisfy a path check
      # would add a full `yarn install` + Vite build to every leg. A stub keeps
      # this workflow about Rust only, and never overwrites a real `dist/`.
      - name: Stub frontend dist (Rust-only build)
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -d app/dist ]; then
            mkdir -p app/dist
            printf '<!doctype html><title>rust-ci placeholder</title>\n' > app/dist/index.html
            echo "created app/dist placeholder"
          else
            echo "app/dist already present — left untouched"
          fi

      # Formatting is platform independent, so gate it once, and first: it
      # costs seconds and failing here saves a 15-minute compile.
      # Local equivalent: `yarn rust:fmt:check`.
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check

      # `--all-targets` covers tests/benches/examples too, so lint debt cannot
      # hide in `#[cfg(test)]`. Local equivalent: `yarn rust:clippy:strict`.
      - name: cargo clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      # Local equivalent: `yarn rust:test`.
      - name: cargo test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  # Aggregate check so Branch Protection can reference one stable name instead
  # of the expanded matrix leg names (which change with the event type — see
  # the matrix expression above). Mirrors `ci-pass` in ci.yml.
  rust-pass:
    name: Rust CI pass
    runs-on: ubuntu-latest
    needs: [rust]
    if: always()
    steps:
      - name: Verify the Rust matrix passed
        run: |
          set -uo pipefail
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::the Rust matrix failed or was cancelled."
            exit 1
          fi
          echo "All Rust jobs passed."
