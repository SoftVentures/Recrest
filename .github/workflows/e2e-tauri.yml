name: 🧪 Tauri E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/**"
      - "shared/**"
      - "tests/**"
      - ".github/workflows/e2e-tauri.yml"
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "shared/**"
      - "tests/**"
      - ".github/workflows/e2e-tauri.yml"

permissions:
  contents: read

concurrency:
  group: e2e-tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-e2e:
    name: Tauri E2E (Linux + webkit2gtk)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - name: System deps (webkit2gtk + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            webkit2gtk-driver \
            xvfb

      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      # SHA-pinned like every other third-party action in this repo — see the
      # note in release-tauri.yml. `toolchain:` has to be spelled out with a
      # SHA pin because the action otherwise infers it from the calling ref.
      - name: Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo (registry + scoped target/)
        # `Swatinem/rust-cache` prunes intermediate build artifacts and
        # scopes by `Cargo.lock` automatically — the previous naïve
        # `actions/cache` on `app/src-tauri/target` would fill GitHub's
        # 10 GB cache budget within a few PRs.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache tauri-driver + tauri-cli
        id: tauri-bins-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/cargo-tauri
          key: tauri-bins-driver0.1.3-cli2.4.0-${{ runner.os }}

      - name: Install tauri-driver + tauri-cli
        if: steps.tauri-bins-cache.outputs.cache-hit != 'true'
        # Both are needed: tauri-driver brokers the WebDriver session,
        # tauri-cli merges `tauri.e2e.conf.json` into the build (the
        # entrypoint uses `cargo tauri build --config …`, which is a
        # tauri-cli command, not a plain cargo one).
        run: |
          cargo install --version 0.1.3 tauri-driver --locked
          cargo install --version 2.4.0 tauri-cli --locked

      - name: Install JS deps
        run: yarn install --frozen-lockfile

      - name: Run E2E (native, no Docker)
        env:
          RECREST_E2E_NATIVE: "1"
        run: bash tests/scripts/run-tauri-e2e.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-logs-${{ github.run_id }}
          # Matches the entrypoint default (`${REPO_ROOT}/target/e2e-logs`).
          # The earlier `app/src-tauri/target/e2e-logs` path was wrong and
          # silently uploaded zero files on every failed run.
          path: target/e2e-logs
          if-no-files-found: ignore
          retention-days: 14
