# Manually dispatched Tauri build producing beta installers from `develop` (or
# any other ref). Performs NO version bump and creates NO GitHub Release.
# The matrix jobs stage installers into OS-specific artifacts; the `collect`
# job consolidates them into ONE artifact with `windows/`, `macos/`, `linux/`
# subfolders.
#
# This workflow deliberately mirrors `release-tauri.yml` step for step where
# the two overlap (Linux system deps, signing-secret forwarding, the updater
# pubkey guard, the macOS signature/architecture gate). A beta that passes
# here and a stable that fails there — or vice versa — means the mirror has
# drifted; fix both files together.
name: 🧪 Release (Tauri Beta)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch, tag, SHA) to build"
        default: develop
        required: false

permissions:
  contents: read

jobs:
  # Regenerate NSIS / DMG branding bitmaps once from the SVG sources and share
  # them with every platform build. tauri.conf.json references the generated
  # files — without them Windows NSIS + macOS DMG bundling fail.
  prepare-assets:
    name: Generate installer assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - uses: ./.github/actions/install-deps
      - run: yarn workspace @recrest/app gen:installer-assets
      - uses: actions/upload-artifact@v7
        with:
          name: installer-assets-build
          path: app/src-tauri/installer-assets/build/
          retention-days: 1
          if-no-files-found: error

  build:
    needs: prepare-assets
    strategy:
      fail-fast: false
      matrix:
        # Per-arch legs mirror the production release workflow so beta artifacts
        # cover the same set (mac arm64/x64, windows x64/arm64, linux x64).
        # `windows-11-arm` is a GitHub-hosted native arm64 runner — availability
        # varies by plan/region (see release-tauri.yml) and the leg is skipped
        # harmlessly via continue-on-error when unavailable. This workflow only
        # stages installers into OS folders; it builds no GitHub release.
        #
        # `releaseLto` mirrors release-tauri.yml: macOS must build with LTO
        # `off` because the `window-vibrancy` crate's macOS-only
        # `NSVisualEffectView` Obj-C class makes fat LTO abort with
        # `failed to load bitcode … window_vibrancy` /
        # `__CLASS_NSVisualEffectViewTagged: symbol multiply defined`.
        # Without this override the beta macOS legs fail where stable succeeds.
        include:
          - platform: macos-latest
            os: macos
            arch: arm64
            rustTarget: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            releaseLto: "off"
          - platform: macos-latest
            os: macos
            arch: x64
            rustTarget: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            releaseLto: "off"
          - platform: ubuntu-22.04
            os: linux
            arch: x64
            rustTarget: ""
            args: ""
            releaseLto: "fat"
          - platform: windows-latest
            os: windows
            arch: x64
            rustTarget: ""
            args: ""
            releaseLto: "fat"
          - platform: windows-11-arm
            os: windows
            arch: arm64
            rustTarget: aarch64-pc-windows-msvc
            args: ""
            releaseLto: "fat"
    runs-on: ${{ matrix.platform }}
    # Scoped to the ONE leg whose availability genuinely varies. A job-level
    # `continue-on-error: true` "allows a workflow run to pass when this job
    # fails" (GitHub's own wording) — so with it applied to the whole matrix, a
    # macOS leg that bundled nothing failed its step, showed red on the leg, and
    # the RUN still concluded success. Combined with the consolidated upload's
    # old `if-no-files-found: warn`, `recrest-beta-<sha>` could ship without any
    # macOS installer and look fine. `windows-11-arm` keeps the exemption
    # because a GitHub-hosted arm64 Windows runner is not guaranteed by plan or
    # region; every other leg must be able to fail the run.
    continue-on-error: ${{ matrix.platform == 'windows-11-arm' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # SHA-pinned for the same reason as in release-tauri.yml: this job holds
      # TAURI_SIGNING_PRIVATE_KEY, and `@stable` / `@v2` are mutable refs.
      # `toolchain:` must be explicit with a SHA pin — the action otherwise
      # derives the toolchain name from the ref it was called with.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-05
        with:
          toolchain: stable
          targets: ${{ matrix.rustTarget }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - uses: ./.github/actions/install-deps

      - name: Download installer-asset bitmaps
        uses: actions/download-artifact@v8
        with:
          name: installer-assets-build
          path: app/src-tauri/installer-assets/build/

      # Mirrors release-tauri.yml. A beta installer built against the
      # placeholder pubkey cannot verify any future update payload, so the
      # tester ends up on a build that can never update itself — worth one
      # grep to catch it here rather than after 20 minutes of bundling.
      - name: Guard against unpopulated updater pubkey
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_MINISIGN_PUBKEY' app/src-tauri/tauri.conf.json; then
            echo "::error::tauri.conf.json still contains the updater pubkey placeholder."
            exit 1
          fi

      # Forward signing secrets only when populated. Tauri's bundler reads the
      # signing env vars via `std::env::var`, which returns `Ok("")` for set-
      # but-empty — not `Err(NotPresent)`. Piping `${{ secrets.FOO }}` directly
      # into `env:` therefore triggers sign/notarize paths even when FOO is
      # unset in the repo, failing e.g. `security import` with an empty .p12.
      # This step writes each secret to $GITHUB_ENV only if non-empty, so
      # missing secrets stay genuinely unset and Tauri skips the feature.
      - name: Forward signing secrets (when configured)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          forward() {
            local name="$1"
            local val="${!name-}"
            if [ -n "$val" ]; then
              {
                printf '%s<<__RECREST_EOF__\n' "$name"
                printf '%s\n' "$val"
                printf '__RECREST_EOF__\n'
              } >> "$GITHUB_ENV"
              echo "forwarded: $name"
            else
              echo "skipped (empty): $name"
            fi
          }
          forward APPLE_CERTIFICATE
          forward APPLE_CERTIFICATE_PASSWORD
          forward APPLE_SIGNING_IDENTITY
          forward APPLE_ID
          forward APPLE_PASSWORD
          forward APPLE_TEAM_ID
          forward WINDOWS_CERTIFICATE
          forward WINDOWS_CERTIFICATE_PASSWORD
          forward TAURI_SIGNING_PRIVATE_KEY
          forward TAURI_SIGNING_PRIVATE_KEY_PASSWORD

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Per-platform LTO — see the matrix comment; `off` on macOS.
          CARGO_PROFILE_RELEASE_LTO: ${{ matrix.releaseLto }}
        with:
          args: ${{ matrix.args }}
          projectPath: ./app

      # `find`, not `shopt -s globstar`. The macOS runners ship bash 3.2, which
      # has no globstar: `shopt -s globstar` exits non-zero there, and because
      # GitHub runs `shell: bash` as `bash --noprofile --norc -eo pipefail`
      # (`-e` is ON), that killed the whole step on its second line. With
      # `if-no-files-found: warn` on the upload below and `continue-on-error`
      # on the job, the run stayed green and the beta artifact simply had no
      # macOS installers in it. `find` behaves identically on bash 3.2 and 5.x.
      - name: Stage installers under OS folder
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -uo pipefail
          dest="stage/$OS"
          mkdir -p "$dest"
          found=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Explicit if/else rather than `cp … && found=…`: with `-e` on, a
            # failed cp would abort the loop mid-way with no log line at all.
            if cp "$f" "$dest/"; then
              found=$((found + 1))
            else
              echo "::error::could not stage $f"
              exit 1
            fi
          done < <(find app/src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.rpm' \) 2>/dev/null)
          if [ "$found" -eq 0 ]; then
            echo "::error::no installers found under app/src-tauri/target for $OS — the bundle step produced nothing"
            exit 1
          fi
          echo "staged $found installer(s):"
          ls -la "$dest"

      - name: Upload staging artifact (${{ matrix.os }})
        uses: actions/upload-artifact@v7
        with:
          # Per-arch legs share `os` (two macos, two windows), so the artifact
          # name must include the arch — upload-artifact@v7 names are immutable
          # and a collision would drop one arch. `collect` downloads by the
          # `recrest-beta-staging-*` pattern + merge-multiple, so distinct names
          # still merge into the same per-OS folders.
          name: recrest-beta-staging-${{ matrix.os }}-${{ matrix.rustTarget || 'native' }}
          path: stage/
          # The staging step above already fails when it finds nothing, so this
          # can no longer mask an empty leg — but keep it strict anyway.
          if-no-files-found: error
          retention-days: 1

      # Same gate as release-tauri.yml's "Verify macOS bundle". Recrest ships
      # WITHOUT an Apple Developer certificate, so `bundle.macOS.signingIdentity`
      # is `-` (ad-hoc). That is not cosmetic: on Apple Silicon, Gatekeeper
      # refuses to launch a quarantined arm64 app whose signature envelope is
      # incomplete and reports "Recrest is damaged and can't be opened" —
      # right-click → Open does NOT bypass it. Catching that on a beta is the
      # entire point of having betas.
      #
      # Deliberately placed AFTER the upload: a failure here should leave the
      # broken bundle in the artifact for post-mortem while still turning the
      # leg red, rather than producing no artifact at all.
      - name: Verify macOS bundle (signature + architecture)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          # `find`, not a glob list: `-e` is on (see the staging step) and both
          # mac legs build with `--target <triple>`, so a bare
          # `target/release/bundle/macos/*.app` never matches and `ls` would
          # exit 2, killing the step before the first echo. `find` exits 0 when
          # it merely matches nothing — but NOT when its root is missing (a
          # build that produced no `target/` at all), and `find | head -n1` can
          # also end in 141 on SIGPIPE; pipefail would turn either into a silent
          # step death, hence `|| true` so an empty `$APP` reaches the ::error::
          # below. `-prune` stops the descent at the bundle so a nested .app
          # can't win.
          APP="$(find app/src-tauri/target -type d -path '*/release/bundle/macos/*.app' -prune 2>/dev/null | head -n1 || true)"
          if [ -z "$APP" ]; then
            echo "::error::no .app bundle produced under app/src-tauri/target"
            exit 1
          fi
          echo "Verifying $APP"

          if [ ! -f "$APP/Contents/_CodeSignature/CodeResources" ]; then
            echo "::error::$APP has no Contents/_CodeSignature/CodeResources — the bundle is unsigned. Apple Silicon will report it as damaged. Check bundle.macOS.signingIdentity in tauri.conf.json."
            exit 1
          fi

          if ! codesign --verify --strict --verbose=2 "$APP"; then
            echo "::error::codesign --verify failed for $APP"
            exit 1
          fi
          codesign -dvv "$APP" 2>&1 | sed 's/^/  /'

          BIN="$(ls "$APP/Contents/MacOS" 2>/dev/null | head -n1 || true)"
          if [ -z "$BIN" ]; then
            echo "::error::$APP has no executable in Contents/MacOS"
            exit 1
          fi
          case "$ARCH" in
            arm64) want=arm64 ;;
            x64)   want=x86_64 ;;
            *)     echo "::error::unmapped mac arch '$ARCH'"; exit 1 ;;
          esac
          got="$(lipo -archs "$APP/Contents/MacOS/$BIN" || true)"
          echo "  archs: $got (expected $want)"
          case " $got " in
            *" $want "*) ;;
            *) echo "::error::$APP/Contents/MacOS/$BIN is '$got', expected '$want' for the $ARCH leg"; exit 1 ;;
          esac
          echo "✓ macOS bundle verified: signed + $want"

  collect:
    name: Collect into single artifact with OS folders
    needs: build
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build.result != 'cancelled' }}
    steps:
      - name: Download all staging artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: recrest-beta-staging-*
          path: merged/
          merge-multiple: true

      - name: List merged tree
        run: ls -R merged || true

      - name: Upload consolidated artifact
        uses: actions/upload-artifact@v7
        with:
          name: recrest-beta-${{ github.sha }}
          path: merged/
          # `error`, not `warn`: an empty consolidated artifact was half the
          # cause of a beta that shipped without macOS installers and still
          # looked green. The per-installer assertion below is the other half.
          if-no-files-found: error
          retention-days: 14

      # The half of the original defect that the `if-no-files-found` fix never
      # reached. `continue-on-error` at job level used to let the RUN conclude
      # success even when a leg bundled nothing, so a macOS-less
      # `recrest-beta-<sha>` looked fine to everyone downstream. That flag is now
      # scoped to `windows-11-arm`; this step is the positive assertion, and it
      # names the missing installer instead of leaving a reviewer to notice an
      # absent folder inside a zip.
      #
      # Deliberately AFTER the upload — same reasoning as the macOS gate in the
      # build job: a partial beta must still be downloadable for post-mortem
      # while the run goes red. `if: always()` because the upload's
      # `if-no-files-found: error` fails the step when merged/ is empty, and the
      # per-installer breakdown is exactly what you want in that log.
      - name: Assert every expected installer arrived
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          rc=0

          # $1 = label, $2 = folder under merged/, $3 = filename glob,
          # $4 = required|optional
          expect_one() {
            local label="$1" dir="merged/$2" glob="$3" severity="$4" n
            # `|| true` + `tr -d ' '`: `-e` is on under `shell: bash`, and
            # `find` on a MISSING root exits non-zero — pipefail would turn that
            # into a silent step death on the assignment, before the annotation
            # that explains which installer is absent.
            n="$(find "$dir" -maxdepth 1 -type f -name "$glob" 2>/dev/null | wc -l | tr -d ' ' || true)"
            if [ "${n:-0}" -gt 0 ]; then
              echo "✓ $label ($glob)"
              return
            fi
            if [ "$severity" = "required" ]; then
              echo "::error::no $label in merged/$2 matching '$glob' — that build leg produced no installer, so the beta artifact would ship without it"
              rc=1
            else
              echo "::warning::no $label in merged/$2 matching '$glob' (optional — runner availability, see the build matrix)"
            fi
          }

          # Tauri-default bundle names: nothing in this workflow renames them,
          # so `productName` "Recrest" yields e.g. `Recrest_0.10.2_aarch64.dmg`
          # and `Recrest_0.10.2_x64-setup.exe`. Asserted per ARCH, not just per
          # OS, so a dead arm64 leg cannot hide behind its x64 sibling. If tauri
          # ever changes an arch token this list is what goes red — update it
          # together with the staging step's extension list above.
          expect_one "macOS arm64 DMG"    macos   '*aarch64*.dmg'      required
          expect_one "macOS x64 DMG"      macos   '*x64*.dmg'          required
          expect_one "Windows x64 NSIS"   windows '*x64*-setup.exe'    required
          expect_one "Windows x64 MSI"    windows '*x64*.msi'          required
          # No AppImage: plan 11 removed it from `bundle.targets`.
          expect_one "Linux .deb"         linux   '*.deb'              required
          expect_one "Linux .rpm"         linux   '*.rpm'              required
          # The documented `windows-11-arm` exception — same one
          # release-tauri.yml's `checksums` job downgrades to a warning.
          expect_one "Windows arm64 NSIS" windows '*arm64*-setup.exe'  optional
          expect_one "Windows arm64 MSI"  windows '*arm64*.msi'        optional

          exit $rc
