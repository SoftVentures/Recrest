name: 📸 Visual Tester

# Manual-only — runs the Playwright suite on Linux, Windows and macOS against
# whatever ref the user picks, uploads screenshots / video / trace artifacts
# per-OS so a reviewer can diff the real cross-platform rendering.
#
# Test failures do NOT block the workflow: snapshot baselines in
# tests/src/e2e/landing/10-responsive.spec.ts are pinned to Chromium-on-Linux
# (see app/CLAUDE.md), so font-rendering diffs on Windows / macOS are
# expected. The point is the artifacts.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test (e.g. develop, feature/foo, v0.7.0)"
        default: develop
        required: true

permissions:
  contents: read

concurrency:
  group: visual-tester-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 is required: Playwright's WebKit bundle links against
          # libgtk-4 / libavif.so.13 / libmanette / libhyphen, none of which
          # ship on 22.04 — same reasoning as the e2e job in ci.yml.
          - { os: ubuntu-24.04, label: linux }
          - { os: windows-latest, label: windows }
          - { os: macos-latest, label: macos }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - uses: ./.github/actions/install-deps

      - uses: ./.github/actions/seed-env

      # Browser cache survives across runs — Playwright pins exact versions
      # per its package.json, so the path key includes the lockfile hash.
      # Forward slashes everywhere; the Actions runner normalises the Windows
      # path under the hood.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Linux needs apt-get for WebKit's system libs — only that step needs
      # sudo. Mirroring the split from ci.yml so --with-deps quirks under
      # yarn workspace don't bite us.
      #
      # We `cd` into the workspace and call `yarn playwright …` directly
      # instead of `yarn workspace @recrest/tests exec playwright …` because
      # yarn-1's `exec` binary-lookup fails on Windows (looks for `playwright`,
      # not `playwright.cmd`). The `cd tests && yarn <bin>` form resolves via
      # node_modules/.bin and handles the Windows extension transparently.
      - name: Install Playwright system deps (Linux)
        if: runner.os == 'Linux'
        working-directory: tests
        run: sudo yarn playwright install-deps

      - name: Install Playwright browsers
        working-directory: tests
        run: yarn playwright install

      - name: Run Playwright tests
        # Assertion errors are non-blocking here — correctness gating lives
        # in ci.yml::e2e. Scoped to desktop projects so the cross-OS render
        # is comparable.
        continue-on-error: true
        working-directory: tests
        run: yarn test:e2e:visual

      # Playwright nests each failure under .screenshots/playwright/<test-dir>/
      # with screenshot.png + trace.zip + video.webm + error-context.md side by
      # side. Browsing the artifact zip means click-through every folder — ugly
      # when all you want is to scan the images.
      #
      # Flatten all PNGs into a single dir prefixed by the test-dir name so
      # filenames stay unique and self-describing. The trace.zip / video.webm /
      # error-context.md live on in the separate HTML-report artifact below
      # whenever a deeper look is needed.
      - name: Flatten screenshots into a single folder
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p screenshots-flat
          if [ -d .screenshots/playwright ]; then
            find .screenshots/playwright -type f -name "*.png" | while IFS= read -r f; do
              dir=$(basename "$(dirname "$f")")
              base=$(basename "$f")
              cp "$f" "screenshots-flat/${dir}__${base}"
            done
          fi
          echo "flattened $(find screenshots-flat -type f | wc -l) PNGs"
          ls -la screenshots-flat || true

      - name: Upload screenshots (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.label }}
          path: screenshots-flat/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload HTML report (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.label }}
          path: tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
